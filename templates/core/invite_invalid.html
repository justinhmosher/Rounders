<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invalid Invitation | Rounders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-red-50 via-white to-white text-slate-900">

  <div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center justify-center gap-3">
          <div class="h-12 w-12 rounded-2xl bg-red-600 text-white flex items-center justify-center font-black text-xl shadow-lg">
            R
          </div>
          <span class="text-3xl font-black tracking-tight">Rounders</span>
        </a>

        <p class="mt-3 text-slate-500 font-medium">
          Scheduling intelligence for CPA firms
        </p>
      </div>

      <!-- Card -->
      <div class="bg-white border border-red-100 rounded-[2rem] shadow-2xl shadow-red-100 p-8 text-center">

        <!-- Icon -->
        <div class="mx-auto h-16 w-16 rounded-3xl bg-red-100 text-red-700 flex items-center justify-center text-3xl font-black">
          !
        </div>

        <h1 class="mt-6 text-3xl font-black tracking-tight">
          Invitation unavailable
        </h1>

        <p class="mt-4 text-slate-500 leading-7">
          {% if message %}
            {{ message }}
          {% else %}
            This invitation link is invalid, expired, or has already been used.
          {% endif %}
        </p>

        <div class="mt-8 space-y-3">
          <a
            href="/"
            class="block w-full bg-red-600 hover:bg-red-700 text-white rounded-2xl py-4 font-black shadow-xl shadow-red-200 transition hover:-translate-y-0.5"
          >
            Return Home
          </a>

          <p class="text-sm text-slate-400">
            Need access? Ask your firm owner to send a new invitation.
          </p>
        </div>

      </div>

      <p class="text-center text-sm text-slate-500 mt-6">
        © Rounders
      </p>

    </div>
  </div>

</body>
</html>
