<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Rounders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-red-50 via-white to-white text-slate-900">

  <div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center justify-center gap-3">
          <div class="h-12 w-12 rounded-2xl bg-red-600 text-white flex items-center justify-center font-black text-xl shadow-lg">
            R
          </div>
          <span class="text-3xl font-black tracking-tight">Rounders</span>
        </a>
        <p class="mt-3 text-slate-500 font-medium">
          Scheduling intelligence for CPA firms
        </p>
      </div>

      <!-- Login Card -->
      <div class="bg-white border border-red-100 rounded-[2rem] shadow-2xl shadow-red-100 p-8">
        <div class="mb-8">
          <h1 class="text-3xl font-black tracking-tight">Welcome back</h1>
          <p class="mt-2 text-slate-500">
            Sign in to your firm dashboard.
          </p>
        </div>

        <form method="POST" action="/login/" class="space-y-5">
          <!-- Django CSRF -->
          <!-- {% csrf_token %} -->

          <!-- Company ID -->
          <div>
            <label for="company_id" class="block text-sm font-black text-slate-700 mb-2">
              Company ID
            </label>
            <input
              type="text"
              id="company_id"
              name="company_id"
              placeholder="ex. RND-1024"
              required
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-slate-900 placeholder:text-slate-400 outline-none transition focus:bg-white focus:border-red-500 focus:ring-4 focus:ring-red-100"
            />
          </div>

          <!-- Username -->
          <div>
            <label for="username" class="block text-sm font-black text-slate-700 mb-2">
              Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-slate-900 placeholder:text-slate-400 outline-none transition focus:bg-white focus:border-red-500 focus:ring-4 focus:ring-red-100"
            />
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-black text-slate-700 mb-2">
              Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-slate-900 placeholder:text-slate-400 outline-none transition focus:bg-white focus:border-red-500 focus:ring-4 focus:ring-red-100"
            />
          </div>

          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 text-sm text-slate-600 font-semibold">
              <input type="checkbox" name="remember_me" class="rounded border-slate-300 text-red-600 focus:ring-red-500" />
              Remember me
            </label>

            <a href="#" class="text-sm font-bold text-red-600 hover:text-red-700">
              Forgot password?
            </a>
          </div>

          <button
            type="submit"
            class="w-full bg-red-600 hover:bg-red-700 text-white rounded-2xl py-4 font-black shadow-xl shadow-red-200 transition hover:-translate-y-0.5"
          >
            Login
          </button>
        </form>
      </div>

      <p class="text-center text-sm text-slate-500 mt-6">
        Need access?
        <a href="/#contact" class="font-bold text-red-600 hover:text-red-700">
          Contact your firm administrator.
        </a>
      </p>

    </div>
  </div>

</body>
</html>
